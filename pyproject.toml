[project]
name = "wispmap-collector"
version = "0.4.0"
description = "WISPMap collector: pings and polls MikroTik devices inside a WISP network"
readme = "README.md"
authors = [
    { name = "Oelof", email = "admin@gigahost.co.za" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "librouteros>=4.2.2",
    "python-dotenv>=1.2.4",
    "uuid6>=2025.0.1",
]

[project.scripts]
wispmap-collector = "wispmap_collector:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["lab: needs the CHR lab network (skip with -m 'not lab')"]
